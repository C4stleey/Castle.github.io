<!DOCTYPE html>
<html>
<head>
    <title>Puzzle Memory Game</title>
    <style>
        body {
            background: #1e1e2f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .game {
            width: 400px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .card {
            height: 80px;
            background: #444;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.3s;
        }

        .card:hover {
            background: #666;
        }

        .matched {
            background: #4caf50;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h1>🧠 Memory Puzzle Game</h1>
<p>Find all matching pairs!</p>

<div class="game" id="gameBoard"></div>
<button onclick="startGame()">Restart</button>

<script>
    const emojis = ["🍎","🍎","🚀","🚀","🐱","🐱","⚽","⚽","🔥","🔥","🎮","🎮","👑","👑","⭐","⭐"];
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;

    function shuffle(array) {
        return array.sort(() => 0.5 - Math.random());
    }

    function startGame() {
        const board = document.getElementById("gameBoard");
        board.innerHTML = "";
        const shuffled = shuffle([...emojis]);

        shuffled.forEach(emoji => {
            const card = document.createElement("div");
            card.classList.add("card");
            card.dataset.emoji = emoji;
            card.innerText = "";
            card.onclick = () => flipCard(card);
            board.appendChild(card);
        });
    }

    function flipCard(card) {
        if (lockBoard || card.innerText !== "") return;

        card.innerText = card.dataset.emoji;

        if (!firstCard) {
            firstCard = card;
            return;
        }

        secondCard = card;
        lockBoard = true;

        if (firstCard.dataset.emoji === secondCard.dataset.emoji) {
            firstCard.classList.add("matched");
            secondCard.classList.add("matched");
            resetTurn();
        } else {
            setTimeout(() => {
                firstCard.innerText = "";
                secondCard.innerText = "";
                resetTurn();
            }, 800);
        }
    }

    function resetTurn() {
        firstCard = null;
        secondCard = null;
        lockBoard = false;
    }

    startGame();
</script>

</body>
</html>
