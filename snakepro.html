<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Castle Snake Pro</title>
<style>
body{
    margin:0;
    background:#111;
    font-family:Arial, sans-serif;
    color:white;
}

.container{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:20px;
    gap:30px;
}

canvas{
    background:#000;
    border:4px solid #00ffcc;
}

.panel{
    width:220px;
    background:#1a1a1a;
    padding:15px;
    border-radius:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    background:#00ffcc;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00ccaa;
}

h2{
    margin-top:0;
}

.stat{
    margin:8px 0;
}
</style>
</head>
<body>

<div class="container">

    <canvas id="game" width="400" height="400"></canvas>

    <div class="panel">
        <h2>🐍 Snake Pro</h2>

        <div class="stat">Coins: <span id="coins">0</span></div>
        <div class="stat">High Score: <span id="highscore">0</span></div>

        <button onclick="startGame()">Play</button>
        <button onclick="restartGame()">Restart</button>

        <hr>

        <h3>Shop</h3>
        <button onclick="buyColor('lime')">Green (10)</button>
        <button onclick="buyColor('cyan')">Cyan (20)</button>
        <button onclick="buyColor('red')">Red (30)</button>
    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let snake;
let direction;
let food;
let gameInterval = null;
let tile = 20;
let running = false;

let coins = parseInt(localStorage.getItem("coins")) || 0;
let highscore = parseInt(localStorage.getItem("highscore")) || 0;
let snakeColor = localStorage.getItem("snakeColor") || "lime";

document.getElementById("coins").innerText = coins;
document.getElementById("highscore").innerText = highscore;

function init(){
    snake = [{x:200,y:200}];
    direction = null;
    spawnFood();
    draw();
}

function startGame(){
    if(running) return;
    running = true;
    gameInterval = setInterval(update,100);
}

function restartGame(){
    clearInterval(gameInterval);
    running = false;
    init();
}

function spawnFood(){
    food = {
        x: Math.floor(Math.random()*20)*20,
        y: Math.floor(Math.random()*20)*20
    };
}

function update(){

    if(!direction) return;

    let head = {x:snake[0].x, y:snake[0].y};

    if(direction=="right") head.x+=tile;
    if(direction=="left") head.x-=tile;
    if(direction=="up") head.y-=tile;
    if(direction=="down") head.y+=tile;

    // wall collision
    if(head.x<0 || head.y<0 || head.x>=400 || head.y>=400){
        gameOver();
        return;
    }

    // self collision
    for(let part of snake){
        if(head.x==part.x && head.y==part.y){
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    if(head.x==food.x && head.y==food.y){
        coins++;
        localStorage.setItem("coins",coins);
        document.getElementById("coins").innerText = coins;
        spawnFood();
    }else{
        snake.pop();
    }

    draw();
}

function gameOver(){
    clearInterval(gameInterval);
    running = false;

    if(snake.length>highscore){
        highscore = snake.length;
        localStorage.setItem("highscore",highscore);
        document.getElementById("highscore").innerText = highscore;
    }

    ctx.fillStyle="rgba(0,0,0,0.7)";
    ctx.fillRect(0,0,400,400);

    ctx.fillStyle="red";
    ctx.font="40px Arial";
    ctx.fillText("GAME OVER",100,200);
}

function draw(){

    ctx.clearRect(0,0,400,400);

    // grid
    ctx.strokeStyle="#222";
    for(let i=0;i<400;i+=20){
        ctx.beginPath();
        ctx.moveTo(i,0);
        ctx.lineTo(i,400);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0,i);
        ctx.lineTo(400,i);
        ctx.stroke();
    }

    // food
    ctx.fillStyle="red";
    ctx.fillRect(food.x,food.y,tile,tile);

    // snake
    ctx.fillStyle=snakeColor;
    for(let part of snake){
        ctx.fillRect(part.x,part.y,tile,tile);
    }
}

function buyColor(color){

    let price = 0;
    if(color=="lime") price=10;
    if(color=="cyan") price=20;
    if(color=="red") price=30;

    if(coins>=price){
        coins-=price;
        localStorage.setItem("coins",coins);
        localStorage.setItem("snakeColor",color);
        snakeColor=color;
        document.getElementById("coins").innerText = coins;
        alert("Color unlocked!");
    }else{
        alert("Not enough coins!");
    }
}

document.addEventListener("keydown", e=>{
    if(e.key=="ArrowRight" && direction!="left") direction="right";
    if(e.key=="ArrowLeft" && direction!="right") direction="left";
    if(e.key=="ArrowUp" && direction!="down") direction="up";
    if(e.key=="ArrowDown" && direction!="up") direction="down";
});

init();

</script>
</body>
</html>
