<!DOCTYPE html>
<html>
<head>
    <title>Drift Car</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Drift Car</h1>
<canvas id="game" width="500" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let car = {x:250,y:200,angle:0,speed:0};

function drawCar(){
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);
    ctx.fillStyle="cyan";
    ctx.fillRect(-20,-10,40,20);
    ctx.restore();
}

function update(){
    ctx.fillStyle="#0f0f1a";
    ctx.fillRect(0,0,500,400);

    car.x += Math.cos(car.angle)*car.speed;
    car.y += Math.sin(car.angle)*car.speed;

    drawCar();
}

document.addEventListener("keydown", e=>{
    if(e.key==="ArrowUp") car.speed=3;
    if(e.key==="ArrowLeft") car.angle-=0.1;
    if(e.key==="ArrowRight") car.angle+=0.1;
});

document.addEventListener("keyup", e=>{
    if(e.key==="ArrowUp") car.speed=0;
});

setInterval(update, 20);
</script>

</body>
</html>
