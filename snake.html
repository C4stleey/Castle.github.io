<!DOCTYPE html>
<html>
<head>
<title>Snake - Castle Games</title>
<style>
body{
    background:#0f0f0f;
    color:white;
    text-align:center;
    font-family:Arial;
    margin:0;
}
canvas{
    background:#1a1a1a;
    display:block;
    margin:20px auto;
    border:3px solid #4CAF50;
}
.back{
    position:absolute;
    top:15px;
    left:15px;
    background:#ff4c4c;
    padding:8px 12px;
    border-radius:8px;
    text-decoration:none;
    color:white;
}
.controls{
    margin-top:10px;
}
select{
    padding:5px;
    border-radius:5px;
}
button{
    padding:8px 15px;
    border:none;
    border-radius:8px;
    background:#4CAF50;
    color:white;
    cursor:pointer;
}
.gameover{
    font-size:24px;
    color:red;
    display:none;
}
</style>
</head>
<body>

<a href="index.html" class="back">⬅ Menu</a>

<h1>🐍 Snake</h1>

<div>
Score: <span id="score">0</span> |
High Score: <span id="high">0</span>
</div>

<div class="controls">
Difficulty:
<select id="difficulty">
<option value="150">Easy</option>
<option value="100" selected>Normal</option>
<option value="70">Hard</option>
</select>

Color:
<select id="color">
<option value="#00ff00">Green</option>
<option value="#00ffff">Cyan</option>
<option value="#ff00ff">Purple</option>
<option value="#ffff00">Yellow</option>
</select>
</div>

<canvas id="game" width="400" height="400"></canvas>

<div class="gameover" id="gameOver">💀 Game Over</div>
<br>
<button onclick="restart()">Restart</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const box = 20;

let snake;
let foods;
let obstacles;
let direction;
let score;
let highScore = localStorage.getItem("snakeHigh") || 0;
document.getElementById("high").innerText = highScore;

let game;

// ===== INICIO =====
function init(){
    snake=[{x:200,y:200}];
    foods=[];
    obstacles=[];
    direction="RIGHT";
    score=0;

    document.getElementById("score").innerText=score;
    document.getElementById("gameOver").style.display="none";

    spawnFood(1);
}

// ===== SPAWN SEGURO COMIDA =====
function spawnFood(amount){
    for(let i=0;i<amount;i++){
        let newFood;
        let valid=false;

        while(!valid){
            newFood={
                x:Math.floor(Math.random()*20)*box,
                y:Math.floor(Math.random()*20)*box
            };

            valid=true;

            for(let part of snake){
                if(part.x===newFood.x && part.y===newFood.y){
                    valid=false;
                }
            }

            for(let o of obstacles){
                if(o.x===newFood.x && o.y===newFood.y){
                    valid=false;
                }
            }
        }

        foods.push(newFood);
    }
}

// ===== SPAWN SEGURO OBSTÁCULO =====
function spawnObstacle(){
    let newObs;
    let valid=false;

    while(!valid){
        newObs={
            x:Math.floor(Math.random()*20)*box,
            y:Math.floor(Math.random()*20)*box
        };

        valid=true;

        for(let part of snake){
            if(part.x===newObs.x && part.y===newObs.y){
                valid=false;
            }
        }

        for(let f of foods){
            if(f.x===newObs.x && f.y===newObs.y){
                valid=false;
            }
        }
    }

    obstacles.push(newObs);
}

// ===== CONTROLES =====
document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft" && direction!=="RIGHT") direction="LEFT";
    if(e.key==="ArrowRight" && direction!=="LEFT") direction="RIGHT";
    if(e.key==="ArrowUp" && direction!=="DOWN") direction="UP";
    if(e.key==="ArrowDown" && direction!=="UP") direction="DOWN";
});

// ===== DIBUJAR =====
function draw(){
    ctx.fillStyle="#1a1a1a";
    ctx.fillRect(0,0,400,400);

    // Obstáculos
    ctx.fillStyle="gray";
    obstacles.forEach(o=>ctx.fillRect(o.x,o.y,box,box));

    // Comida
    ctx.fillStyle="red";
    foods.forEach(f=>ctx.fillRect(f.x,f.y,box,box));

    // Serpiente
    let snakeColor=document.getElementById("color").value;

    for(let i=0;i<snake.length;i++){
        ctx.fillStyle=i===0?snakeColor:"#00aa00";
        ctx.fillRect(snake[i].x,snake[i].y,box,box);
    }

    let headX=snake[0].x;
    let headY=snake[0].y;

    if(direction==="LEFT") headX-=box;
    if(direction==="RIGHT") headX+=box;
    if(direction==="UP") headY-=box;
    if(direction==="DOWN") headY+=box;

    // Colisión con pared
    if(headX<0||headY<0||headX>=400||headY>=400){
        gameOver();
        return;
    }

    // Colisión obstáculo
    for(let o of obstacles){
        if(headX===o.x && headY===o.y){
            gameOver();
            return;
        }
    }

    // Colisión consigo misma
    for(let part of snake){
        if(headX===part.x && headY===part.y){
            gameOver();
            return;
        }
    }

    let ate=false;

    for(let i=0;i<foods.length;i++){
        if(headX===foods[i].x && headY===foods[i].y){
            score++;
            document.getElementById("score").innerText=score;
            foods.splice(i,1);
            spawnFood(1);
            ate=true;

            if(score%5===0){
                spawnObstacle();
            }
            break;
        }
    }

    if(!ate){
        snake.pop();
    }

    snake.unshift({x:headX,y:headY});
}

// ===== GAME OVER =====
function gameOver(){
    clearInterval(game);
    document.getElementById("gameOver").style.display="block";

    if(score>highScore){
        highScore=score;
        localStorage.setItem("snakeHigh",highScore);
        document.getElementById("high").innerText=highScore;
    }
}

// ===== REINICIAR =====
function restart(){
    clearInterval(game);
    init();
    let speed=document.getElementById("difficulty").value;
    game=setInterval(draw,speed);
}

// START
init();
game=setInterval(draw,100);
</script>

</body>
</html>
