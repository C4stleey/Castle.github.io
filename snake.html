<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake Pro 2.0</title>
<style>
body {
    margin: 0;
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    background: black;
    border: 5px solid #7fffd4;
}
</style>
</head>
<body>

<canvas id="game" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let gameState = "menu";

let coins = parseInt(localStorage.getItem("coins")) || 0;
let highscore = parseInt(localStorage.getItem("highscore")) || 0;

// ================= GAME BASE =================

let snake = [];
let direction = "right";
let food = {};
let score = 0;

let lastTime = 0;
let baseSpeed = 120;

let selectedBiome = parseInt(localStorage.getItem("biome")) || 0;
let selectedFruit = parseInt(localStorage.getItem("fruit")) || 0;
let selectedPower = parseInt(localStorage.getItem("power")) || 0;

let unlockedBiomes = JSON.parse(localStorage.getItem("unlockedBiomes")) || [0];
let unlockedFruits = JSON.parse(localStorage.getItem("unlockedFruits")) || [0];
let unlockedPowers = JSON.parse(localStorage.getItem("unlockedPowers")) || [0];

// ================= OPTIONS =================

let biomes = [
    { name:"Classic", price:0 },
    { name:"Snow", price:50 },
    { name:"Desert", price:80 }
];

let fruits = [
    { name:"Apple", price:0 },
    { name:"Banana", price:30 }
];

let powers = [
    { name:"None", price:0 },
    { name:"Speed x2", price:40 },
    { name:"Speed x3", price:60 },
    { name:"Multiple x2", price:70 }
];

// ================= MENU =================

function drawMenu(){
    ctx.clearRect(0,0,600,600);

    ctx.fillStyle="white";
    ctx.textAlign="center";

    ctx.font="40px Arial";
    ctx.fillText("SNAKE PRO 2.0",300,150);

    ctx.font="25px Arial";
    ctx.fillText("PLAY",300,250);
    ctx.fillText("SHOP",300,300);
    ctx.fillText("SETTINGS",300,350);

    ctx.font="18px Arial";
    ctx.fillText("Highscore: "+highscore,300,420);
    ctx.fillText("Coins: "+coins,300,450);
}

// ================= SETTINGS =================

function drawSettings(){
    ctx.clearRect(0,0,600,600);

    ctx.fillStyle="white";
    ctx.textAlign="center";

    ctx.font="35px Arial";
    ctx.fillText("SETTINGS",300,80);

    ctx.textAlign="left";
    ctx.fillText("← RETURN",20,40);

    ctx.textAlign="right";
    ctx.fillText("Coins: "+coins,580,40);

    ctx.textAlign="center";
    ctx.font="22px Arial";

    // BIOME
    ctx.fillText("Biomes",300,150);
    ctx.fillText("<  "+biomes[selectedBiome].name+"  >",300,180);
    drawUnlockText(unlockedBiomes,selectedBiome,biomes,300,205);

    // FRUIT
    ctx.fillText("Fruits",300,260);
    ctx.fillText("<  "+fruits[selectedFruit].name+"  >",300,290);
    drawUnlockText(unlockedFruits,selectedFruit,fruits,300,315);

    // POWER
    ctx.fillText("Power Ups",300,370);
    ctx.fillText("<  "+powers[selectedPower].name+"  >",300,400);
    drawUnlockText(unlockedPowers,selectedPower,powers,300,425);
}

function drawUnlockText(unlocked,index,array,x,y){
    if(unlocked.includes(index)){
        ctx.fillText("OWNED (click to use)",x,y);
    } else {
        ctx.fillText("BUY - "+array[index].price+" Coins",x,y);
    }
}

// ================= GAME =================

function startGame(){
    snake=[{x:10,y:10}];
    direction="right";
    score=0;
    spawnFood();
    gameState="game";
}

function spawnFood(){
    food={
        x:Math.floor(Math.random()*30),
        y:Math.floor(Math.random()*30)
    };
}

function updateGame(){
    if(gameState!=="game") return;

    let head={...snake[0]};

    if(direction==="right") head.x++;
    if(direction==="left") head.x--;
    if(direction==="up") head.y--;
    if(direction==="down") head.y++;

    if(head.x<0||head.x>=30||head.y<0||head.y>=30) return endGame();

    for(let part of snake){
        if(head.x===part.x&&head.y===part.y) return endGame();
    }

    snake.unshift(head);

    if(head.x===food.x&&head.y===food.y){
        score++;
        coins++;
        spawnFood();
    } else {
        snake.pop();
    }
}

function drawGame(){
    ctx.clearRect(0,0,600,600);

    ctx.fillStyle="lime";
    for(let part of snake){
        ctx.fillRect(part.x*20,part.y*20,20,20);
    }

    ctx.fillStyle= selectedFruit===1 ? "yellow" : "red";
    ctx.fillRect(food.x*20,food.y*20,20,20);

    ctx.fillStyle="white";
    ctx.textAlign="left";
    ctx.fillText("Score: "+score,10,20);
}

function endGame(){
    if(score>highscore){
        highscore=score;
        localStorage.setItem("highscore",highscore);
    }
    localStorage.setItem("coins",coins);
    gameState="menu";
}

// ================= INPUT =================

document.addEventListener("keydown",e=>{
    if(gameState==="game"){
        if(e.key==="ArrowUp"&&direction!=="down")direction="up";
        if(e.key==="ArrowDown"&&direction!=="up")direction="down";
        if(e.key==="ArrowLeft"&&direction!=="right")direction="left";
        if(e.key==="ArrowRight"&&direction!=="left")direction="right";
    }
});

canvas.addEventListener("click",e=>{
    let y=e.offsetY;

    if(gameState==="menu"){
        if(y>230&&y<260) startGame();
        if(y>280&&y<310) gameState="shop";
        if(y>330&&y<360) gameState="settings";
    }

    else if(gameState==="settings"){

        if(e.offsetX<150&&y<60){
            gameState="menu";
            return;
        }

        handleOption(e,150,180,"biome");
        handleOption(e,260,290,"fruit");
        handleOption(e,370,400,"power");
    }
});

function handleOption(e,minY,maxY,type){
    if(e.offsetY>minY&&e.offsetY<maxY){

        if(e.offsetX<200) changeOption(type,-1);
        else if(e.offsetX>400) changeOption(type,1);
        else buyOrSelect(type);
    }
}

function changeOption(type,dir){
    if(type==="biome"){
        selectedBiome=(selectedBiome+dir+biomes.length)%biomes.length;
    }
    if(type==="fruit"){
        selectedFruit=(selectedFruit+dir+fruits.length)%fruits.length;
    }
    if(type==="power"){
        selectedPower=(selectedPower+dir+powers.length)%powers.length;
    }
}

function buyOrSelect(type){
    if(type==="biome") handleBuy(selectedBiome,biomes,unlockedBiomes,"biome");
    if(type==="fruit") handleBuy(selectedFruit,fruits,unlockedFruits,"fruit");
    if(type==="power") handleBuy(selectedPower,powers,unlockedPowers,"power");
}

function handleBuy(index,array,unlocked,key){
    if(!unlocked.includes(index)){
        if(coins>=array[index].price){
            coins-=array[index].price;
            unlocked.push(index);
            localStorage.setItem("coins",coins);
            localStorage.setItem("unlocked"+capitalize(key)+"s",JSON.stringify(unlocked));
        }
    } else {
        localStorage.setItem(key,index);
    }
}

function capitalize(str){
    return str.charAt(0).toUpperCase()+str.slice(1);
}

    const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let gameState = "menu";

let coins = parseInt(localStorage.getItem("coins")) || 0;
let highscore = parseInt(localStorage.getItem("highscore")) || 0;

let snake = [];
let direction = "right";
let foods = [];
let score = 0;

let lastTime = 0;
let baseSpeed = 120;
let currentSpeed = 120;

let selectedBiome = parseInt(localStorage.getItem("biome")) || 0;
let selectedFruit = parseInt(localStorage.getItem("fruit")) || 0;
let selectedPower = parseInt(localStorage.getItem("power")) || 0;

let slowTiles = [];
let pyramids = [];

let gridSize = 20;
let tileCount = 30;

// ================= OPTIONS =================

let biomes = [
    { name:"Classic", price:0 },
    { name:"Snow", price:50 },
    { name:"Desert", price:80 }
];

let fruits = [
    { name:"Apple", price:0 },
    { name:"Banana", price:30 }
];

let powers = [
    { name:"None", price:0 },
    { name:"Speed x2", price:40 },
    { name:"Speed x3", price:60 },
    { name:"Multiple x2", price:70 }
];

let unlockedBiomes = JSON.parse(localStorage.getItem("unlockedBiomes")) || [0];
let unlockedFruits = JSON.parse(localStorage.getItem("unlockedFruits")) || [0];
let unlockedPowers = JSON.parse(localStorage.getItem("unlockedPowers")) || [0];

// ================= GAME START =================

function startGame(){
    snake=[{x:15,y:15}];
    direction="right";
    score=0;
    foods=[];
    slowTiles=[];
    pyramids=[];
    generateBiome();
    spawnFood();
    gameState="game";
}

// ================= BIOMES =================

function generateBiome(){

    if(selectedBiome===1){ // Snow
        for(let i=0;i<20;i++){
            slowTiles.push({
                x:Math.floor(Math.random()*tileCount),
                y:Math.floor(Math.random()*tileCount)
            });
        }
    }

    if(selectedBiome===2){ // Desert
        for(let i=0;i<10;i++){
            pyramids.push({
                x:Math.floor(Math.random()*tileCount),
                y:Math.floor(Math.random()*tileCount)
            });
        }
    }
}

// ================= FOOD =================

function spawnFood(){

    let amount = selectedPower===3 ? 2 : 1;

    for(let i=foods.length;i<amount;i++){
        foods.push({
            x:Math.floor(Math.random()*tileCount),
            y:Math.floor(Math.random()*tileCount)
        });
    }
}

// ================= UPDATE =================

function updateGame(){
    if(gameState!=="game") return;

    let head={...snake[0]};

    if(direction==="right") head.x++;
    if(direction==="left") head.x--;
    if(direction==="up") head.y--;
    if(direction==="down") head.y++;

    if(head.x<0||head.x>=tileCount||head.y<0||head.y>=tileCount)
        return endGame();

    for(let part of snake){
        if(head.x===part.x&&head.y===part.y)
            return endGame();
    }

    for(let p of pyramids){
        if(head.x===p.x&&head.y===p.y)
            return endGame();
    }

    snake.unshift(head);

    let ate=false;

    for(let i=foods.length-1;i>=0;i--){
        if(head.x===foods[i].x && head.y===foods[i].y){
            foods.splice(i,1);
            score++;
            coins++;
            ate=true;
        }
    }

    if(!ate){
        snake.pop();
    } else {
        spawnFood();
    }

    // Speed scaling
    currentSpeed = baseSpeed - Math.min(score*2,40);

    if(selectedPower===1) currentSpeed=70;
    if(selectedPower===2) currentSpeed=50;

    // Snow slow effect
    for(let s of slowTiles){
        if(head.x===s.x&&head.y===s.y){
            currentSpeed=200;
        }
    }
}

// ================= DRAW =================

function drawGrid(){
    ctx.strokeStyle="#111";
    for(let i=0;i<tileCount;i++){
        ctx.beginPath();
        ctx.moveTo(i*gridSize,0);
        ctx.lineTo(i*gridSize,600);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0,i*gridSize);
        ctx.lineTo(600,i*gridSize);
        ctx.stroke();
    }
}

function drawGame(){
    ctx.clearRect(0,0,600,600);

    drawGrid();

    // Snow tiles
    if(selectedBiome===1){
        ctx.fillStyle="#cceeff";
        for(let s of slowTiles){
            ctx.fillRect(s.x*gridSize,s.y*gridSize,gridSize,gridSize);
        }
    }

    // Desert pyramids
    if(selectedBiome===2){
        ctx.fillStyle="orange";
        for(let p of pyramids){
            ctx.beginPath();
            ctx.moveTo(p.x*gridSize,p.y*gridSize+gridSize);
            ctx.lineTo(p.x*gridSize+gridSize/2,p.y*gridSize);
            ctx.lineTo(p.x*gridSize+gridSize,p.y*gridSize+gridSize);
            ctx.fill();
        }
    }

    // Snake
    ctx.fillStyle="lime";
    for(let part of snake){
        ctx.fillRect(part.x*gridSize,part.y*gridSize,gridSize,gridSize);
    }

    // Food
    ctx.fillStyle= selectedFruit===1 ? "yellow" : "red";
    for(let f of foods){
        ctx.fillRect(f.x*gridSize,f.y*gridSize,gridSize,gridSize);
    }

    ctx.fillStyle="white";
    ctx.fillText("Score: "+score,10,20);
    ctx.fillText("Highscore: "+highscore,10,40);
    ctx.fillText("Coins: "+coins,10,60);
}

// ================= END =================

function endGame(){
    if(score>highscore){
        highscore=score;
        localStorage.setItem("highscore",highscore);
    }
    localStorage.setItem("coins",coins);
    gameState="menu";
}

// ================= INPUT =================

document.addEventListener("keydown",e=>{
    if(gameState==="game"){
        if(e.key==="ArrowUp"&&direction!=="down")direction="up";
        if(e.key==="ArrowDown"&&direction!=="up")direction="down";
        if(e.key==="ArrowLeft"&&direction!=="right")direction="left";
        if(e.key==="ArrowRight"&&direction!=="left")direction="right";
    }
});

// ================= LOOP =================

function loop(time){
    if(time-lastTime>currentSpeed){
        updateGame();
        lastTime=time;
    }

    if(gameState==="menu") drawMenu();
    if(gameState==="settings") drawSettings();
    if(gameState==="game") drawGame();

    requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
