<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let gameState = "menu";
let coins = 13;

let snakeColor = "lime";
let selectedBiome = 0;
let selectedFruit = 0;
let selectedPower = 0;

const biomes = [
  { name: "Classic", owned: true, price: 0 },
  { name: "Snow", owned: false, price: 20 },
  { name: "Desert", owned: false, price: 30 }
];

const fruits = [
  { name: "Apple", owned: true, price: 0 },
  { name: "Banana", owned: false, price: 15 }
];

const powers = [
  { name: "None", owned: true, price: 0 },
  { name: "Speed x2", owned: false, price: 25 },
  { name: "Speed x3", owned: false, price: 40 }
];

let snake, dx, dy, food;

function startGame() {
  snake = [{x:200,y:200}];
  dx = 20;
  dy = 0;
  spawnFood();
  gameState = "game";
}

function spawnFood(){
  food = {
    x: Math.floor(Math.random()*20)*20,
    y: Math.floor(Math.random()*20)*20
  };
}

function update(){
  if(gameState !== "game") return;

  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  snake.unshift(head);

  if(head.x === food.x && head.y === food.y){
    coins++;
    spawnFood();
  } else {
    snake.pop();
  }

  if(head.x < 0 || head.x >= 600 || head.y < 0 || head.y >= 600){
    gameState = "menu";
  }
}

function draw(){
  ctx.clearRect(0,0,600,600);

  ctx.strokeStyle = "#7fffd4";
  ctx.lineWidth = 5;
  ctx.strokeRect(5,5,590,590);

  ctx.fillStyle = "white";
  ctx.font = "30px Arial";

  if(gameState === "menu"){
    ctx.fillText("SNAKE GAME", 200,200);
    ctx.fillText("PLAY", 260,270);
    ctx.fillText("SHOP", 260,320);
    ctx.fillText("SETTINGS", 240,370);
  }

  if(gameState === "shop"){
    ctx.fillText("SHOP",250,80);
    ctx.fillText("Coins: "+coins,400,40);
    ctx.fillText("← RETURN",40,40);

    ctx.fillStyle="lime";
    ctx.fillRect(200,200,50,50);

    ctx.fillStyle="red";
    ctx.fillRect(300,200,50,50);

    ctx.fillStyle="cyan";
    ctx.fillRect(400,200,50,50);
  }

  if(gameState === "settings"){
    ctx.fillText("SETTINGS",220,80);
    ctx.fillText("Coins: "+coins,400,40);
    ctx.fillText("← RETURN",40,40);

    ctx.fillText("Biomes",260,150);
    ctx.fillText("< "+biomes[selectedBiome].name+" >",230,180);
    ctx.fillText(
      biomes[selectedBiome].owned ? 
      "OWNED (click to use)" : 
      "BUY: "+biomes[selectedBiome].price,
      200,210
    );

    ctx.fillText("Fruits",260,270);
    ctx.fillText("< "+fruits[selectedFruit].name+" >",230,300);
    ctx.fillText(
      fruits[selectedFruit].owned ? 
      "OWNED (click to use)" : 
      "BUY: "+fruits[selectedFruit].price,
      200,330
    );

    ctx.fillText("Power Ups",240,390);
    ctx.fillText("< "+powers[selectedPower].name+" >",210,420);
    ctx.fillText(
      powers[selectedPower].owned ? 
      "OWNED (click to use)" : 
      "BUY: "+powers[selectedPower].price,
      200,450
    );
  }

  if(gameState === "game"){
    ctx.fillStyle = snakeColor;
    snake.forEach(s=>ctx.fillRect(s.x,s.y,20,20));

    ctx.fillStyle = selectedFruit===0 ? "red" : "yellow";
    ctx.fillRect(food.x,food.y,20,20);

    ctx.fillStyle="white";
    ctx.fillText("Coins: "+coins,20,40);
  }
}

canvas.addEventListener("click",(e)=>{
  const x=e.offsetX;
  const y=e.offsetY;

  if(gameState==="menu"){
    if(y>240 && y<280) startGame();
    if(y>290 && y<330) gameState="shop";
    if(y>340 && y<380) gameState="settings";
  }

  if(gameState==="shop"){
    if(x<120 && y<80) gameState="menu";

    if(x>200&&x<250&&y>200&&y<250) snakeColor="lime";
    if(x>300&&x<350&&y>200&&y<250) snakeColor="red";
    if(x>400&&x<450&&y>200&&y<250) snakeColor="cyan";
  }

  if(gameState==="settings"){
    if(x<120 && y<80) gameState="menu";

    if(y>160 && y<200){
      selectedBiome=(selectedBiome+1)%biomes.length;
    }

    if(y>290 && y<330){
      selectedFruit=(selectedFruit+1)%fruits.length;
    }

    if(y>410 && y<450){
      selectedPower=(selectedPower+1)%powers.length;
    }

    if(y>200 && y<230){
      const item=biomes[selectedBiome];
      if(!item.owned && coins>=item.price){
        coins-=item.price;
        item.owned=true;
      }
    }

    if(y>320 && y<350){
      const item=fruits[selectedFruit];
      if(!item.owned && coins>=item.price){
        coins-=item.price;
        item.owned=true;
      }
    }

    if(y>440 && y<470){
      const item=powers[selectedPower];
      if(!item.owned && coins>=item.price){
        coins-=item.price;
        item.owned=true;
      }
    }
  }
});

document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowUp"&&dy===0){dx=0;dy=-20;}
  if(e.key==="ArrowDown"&&dy===0){dx=0;dy=20;}
  if(e.key==="ArrowLeft"&&dx===0){dx=-20;dy=0;}
  if(e.key==="ArrowRight"&&dx===0){dx=20;dy=0;}
});

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
