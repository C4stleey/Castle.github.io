<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake Pro</title>
<style>
body{
    margin:0;
    background:#111;
    text-align:center;
    font-family:Arial;
    color:white;
}
canvas{
    background:#000;
    border:4px solid #555;
    margin-top:20px;
}
</style>
</head>
<body>

<h1>🐍 Snake Pro</h1>
<canvas id="game" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let box = 20;
let gameState = "menu";

let snake = [];
let direction = "RIGHT";
let food = {};
let obstacles = [];
let slowTiles = [];

let score = 0;
let highScore = 0;
let coins = 0;

let selectedBiome = 0;
let selectedFruit = 0;
let selectedPower = 0;

const biomes = ["Classic","Snow","Desert"];
const fruits = ["Apple","Banana"];
const powers = ["Normal","Speed x2","Speed x3","Speed x5"];

let baseSpeed = 150;
let currentSpeed = baseSpeed;
let lastTime = 0;

function startGame(){
    snake = [{x:200,y:200}];
    direction = "RIGHT";
    score = 0;
    obstacles = [];
    slowTiles = [];

    currentSpeed = baseSpeed;

    if(powers[selectedPower]==="Speed x2") currentSpeed = 110;
    if(powers[selectedPower]==="Speed x3") currentSpeed = 80;
    if(powers[selectedPower]==="Speed x5") currentSpeed = 50;

    generateFood();
    generateBiomeStuff();

    gameState="game";
}

function generateFood(){
    food = {
        x:Math.floor(Math.random()*20)*box,
        y:Math.floor(Math.random()*20)*box
    };
}

function generateBiomeStuff(){

    if(biomes[selectedBiome]==="Desert"){
        for(let i=0;i<6;i++){
            obstacles.push({
                x:Math.floor(Math.random()*20)*box,
                y:Math.floor(Math.random()*20)*box
            });
        }
    }

    if(biomes[selectedBiome]==="Snow"){
        for(let i=0;i<8;i++){
            slowTiles.push({
                x:Math.floor(Math.random()*20)*box,
                y:Math.floor(Math.random()*20)*box
            });
        }
    }
}

document.addEventListener("keydown", e=>{
    if(e.key==="ArrowUp" && direction!=="DOWN") direction="UP";
    if(e.key==="ArrowDown" && direction!=="UP") direction="DOWN";
    if(e.key==="ArrowLeft" && direction!=="RIGHT") direction="LEFT";
    if(e.key==="ArrowRight" && direction!=="LEFT") direction="RIGHT";
});

canvas.addEventListener("click", e=>{
    let rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    if(gameState==="menu"){
        if(y>180 && y<220) startGame();
        if(y>240 && y<280) gameState="settings";
    }

    else if(gameState==="settings"){
        if(y>100 && y<130) selectedBiome=(selectedBiome+1)%biomes.length;
        if(y>160 && y<190) selectedFruit=(selectedFruit+1)%fruits.length;
        if(y>220 && y<250) selectedPower=(selectedPower+1)%powers.length;
        if(y>300 && y<330) gameState="menu";
    }
});

function updateGame(){

    let headX = snake[0].x;
    let headY = snake[0].y;

    if(direction==="UP") headY-=box;
    if(direction==="DOWN") headY+=box;
    if(direction==="LEFT") headX-=box;
    if(direction==="RIGHT") headX+=box;

    if(headX<0 || headX>=400 || headY<0 || headY>=400){
        gameOver();
        return;
    }

    for(let s of snake){
        if(headX===s.x && headY===s.y){
            gameOver();
            return;
        }
    }

    for(let o of obstacles){
        if(headX===o.x && headY===o.y){
            gameOver();
            return;
        }
    }

    let newHead={x:headX,y:headY};

    if(headX===food.x && headY===food.y){
        score++;
        coins++;
        generateFood();
    }else{
        snake.pop();
    }

    snake.unshift(newHead);

        // Snow slow effect
    if(biomes[selectedBiome]==="Snow"){
        for(let tile of slowTiles){
            if(headX===tile.x && headY===tile.y){
                currentSpeed = 220;
            }
        }
    }
}

function gameOver(){
    if(score>highScore) highScore=score;
    gameState="menu";
}

function drawMenu(){
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,400,400);

    ctx.fillStyle="white";
    ctx.font="20px Arial";
    ctx.fillText("PLAY",170,205);
    ctx.fillText("SETTINGS",150,265);

    ctx.fillText("HighScore: "+highScore,120,50);
    ctx.fillText("Coins: "+coins,150,80);
}

function drawSettings(){
    ctx.fillStyle="#111";
    ctx.fillRect(0,0,400,400);

    ctx.fillStyle="white";
    ctx.font="16px Arial";

    ctx.fillText("Biome: "+biomes[selectedBiome],100,120);
    ctx.fillText("Fruit: "+fruits[selectedFruit],100,180);
    ctx.fillText("Power: "+powers[selectedPower],100,240);

    ctx.fillText("Return",150,320);
}

function drawGame(){

    if(biomes[selectedBiome]==="Classic") ctx.fillStyle="#000";
    if(biomes[selectedBiome]==="Snow") ctx.fillStyle="#dff6ff";
    if(biomes[selectedBiome]==="Desert") ctx.fillStyle="#edc988";

    ctx.fillRect(0,0,400,400);

    // slow tiles (snow)
    ctx.fillStyle="#bde0fe";
    for(let tile of slowTiles){
        ctx.fillRect(tile.x,tile.y,box,box);
    }

    // obstacles (desert pyramids)
    ctx.fillStyle="#8d5524";
    for(let o of obstacles){
        ctx.beginPath();
        ctx.moveTo(o.x+10,o.y);
        ctx.lineTo(o.x,o.y+20);
        ctx.lineTo(o.x+20,o.y+20);
        ctx.closePath();
        ctx.fill();
    }

    // snake
    ctx.fillStyle="lime";
    for(let s of snake){
        ctx.fillRect(s.x,s.y,box,box);
    }

    // fruit
    if(fruits[selectedFruit]==="Apple") ctx.fillStyle="red";
    if(fruits[selectedFruit]==="Banana") ctx.fillStyle="yellow";

    ctx.fillRect(food.x,food.y,box,box);

    ctx.fillStyle="black";
    ctx.font="14px Arial";
    ctx.fillText("Score: "+score,10,15);
}

function loop(time){

    if(gameState==="game"){
        if(time-lastTime>currentSpeed){
            updateGame();
            lastTime=time;
        }
    }

    if(gameState==="menu") drawMenu();
    if(gameState==="settings") drawSettings();
    if(gameState==="game") drawGame();

    requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
