<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Castle Snake</title>
<style>
body{
    margin:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
canvas{
    background:#000;
    border:4px solid #00ffcc;
}
</style>
</head>
<body>

<canvas id="game" width="500" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const tile = 20;
const size = 500;

let state = "menu"; // menu, game, gameover, shop
let snake, direction, food;
let interval;
let speed = 100;

let coins = parseInt(localStorage.getItem("coins")) || 0;
let highscore = parseInt(localStorage.getItem("highscore")) || 0;
let unlockedColors = JSON.parse(localStorage.getItem("colors")) || ["lime"];
let snakeColor = localStorage.getItem("snakeColor") || "lime";

function save(){
    localStorage.setItem("coins",coins);
    localStorage.setItem("highscore",highscore);
    localStorage.setItem("colors",JSON.stringify(unlockedColors));
    localStorage.setItem("snakeColor",snakeColor);
}

function initGame(){
    snake = [{x:240,y:240}];
    direction = null;
    spawnFood();
}

function spawnFood(){
    food = {
        x: Math.floor(Math.random()*25)*20,
        y: Math.floor(Math.random()*25)*20
    };
}

function startGame(){
    state="game";
    initGame();
    interval=setInterval(update,speed);
}

function update(){

    if(!direction) return;

    let head={x:snake[0].x,y:snake[0].y};

    if(direction=="right") head.x+=tile;
    if(direction=="left") head.x-=tile;
    if(direction=="up") head.y-=tile;
    if(direction=="down") head.y+=tile;

    if(head.x<0||head.y<0||head.x>=size||head.y>=size){
        endGame();
        return;
    }

    for(let part of snake){
        if(head.x==part.x&&head.y==part.y){
            endGame();
            return;
        }
    }

    snake.unshift(head);

    if(head.x==food.x&&head.y==food.y){
        coins++;
        spawnFood();
    }else{
        snake.pop();
    }
}

function endGame(){
    clearInterval(interval);
    state="gameover";

    if(snake.length>highscore){
        highscore=snake.length;
    }

    save();
}

function drawGrid(){
    ctx.strokeStyle="#222";
    for(let i=0;i<size;i+=20){
        ctx.beginPath();
        ctx.moveTo(i,0);
        ctx.lineTo(i,size);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0,i);
        ctx.lineTo(size,i);
        ctx.stroke();
    }
}

function drawHUD(){
    ctx.fillStyle="white";
    ctx.font="16px Arial";
    ctx.fillText("Score: "+snake.length,10,20);
    ctx.fillText("High: "+highscore,180,20);
    ctx.fillText("Coins: "+coins,380,20);
}

function draw(){
    ctx.clearRect(0,0,size,size);

    if(state=="menu"){
        ctx.fillStyle="white";
        ctx.font="40px Arial";
        ctx.fillText("🐍 CASTLE SNAKE",90,160);

        ctx.fillStyle="#00ffcc";
        ctx.fillRect(175,220,150,50);
        ctx.fillRect(175,290,150,50);

        ctx.fillStyle="black";
        ctx.font="20px Arial";
        ctx.fillText("PLAY",220,252);
        ctx.fillText("SHOP",220,322);
    }

    if(state=="game"){
        drawGrid();
        drawHUD();

        ctx.fillStyle="red";
        ctx.fillRect(food.x,food.y,tile,tile);

        ctx.fillStyle=snakeColor;
        for(let part of snake){
            ctx.fillRect(part.x,part.y,tile,tile);
        }
    }

    if(state=="gameover"){
        drawGrid();
        drawHUD();

        ctx.fillStyle="red";
        ctx.font="40px Arial";
        ctx.fillText("GAME OVER",140,220);

        ctx.font="20px Arial";
        ctx.fillText("Click to return",180,270);
    }

    if(state=="shop"){
        ctx.fillStyle="white";
        ctx.font="30px Arial";
        ctx.fillText("SHOP",200,80);

        let colors=["lime","cyan","red"];
        let prices=[0,20,40];

        for(let i=0;i<colors.length;i++){
            ctx.fillStyle=colors[i];
            ctx.fillRect(120+i*100,200,50,50);

            ctx.fillStyle="white";
            ctx.fillText(prices[i]+"$",120+i*100,270);

            if(unlockedColors.includes(colors[i])){
                ctx.fillText("Owned",120+i*100,300);
            }
        }

        ctx.fillText("Click color to buy/select",120,350);
        ctx.fillText("Click top to return",150,380);
    }

    requestAnimationFrame(draw);
}

canvas.addEventListener("click",e=>{
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const my=e.clientY-rect.top;

    if(state=="menu"){
        if(mx>175&&mx<325&&my>220&&my<270){
            startGame();
        }
        if(mx>175&&mx<325&&my>290&&my<340){
            state="shop";
        }
    }

    else if(state=="gameover"){
        state="menu";
    }

    else if(state=="shop"){

        let colors=["lime","cyan","red"];
        let prices=[0,20,40];

        for(let i=0;i<colors.length;i++){
            let x=120+i*100;
            if(mx>x&&mx<x+50&&my>200&&my<250){
                if(unlockedColors.includes(colors[i])){
                    snakeColor=colors[i];
                }else if(coins>=prices[i]){
                    coins-=prices[i];
                    unlockedColors.push(colors[i]);
                    snakeColor=colors[i];
                }
                save();
            }
        }

        if(my<100){
            state="menu";
        }
    }
});

document.addEventListener("keydown",e=>{
    if(e.key=="ArrowRight"&&direction!="left")direction="right";
    if(e.key=="ArrowLeft"&&direction!="right")direction="left";
    if(e.key=="ArrowUp"&&direction!="down")direction="up";
    if(e.key=="ArrowDown"&&direction!="up")direction="down";
});

draw();
</script>
</body>
</html>
