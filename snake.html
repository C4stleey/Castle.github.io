<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Castle Snake Pro</title>
<style>
body{
    margin:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;
}
canvas{
    background:#000;
    border:4px solid #00ffcc;
}
</style>
</head>
<body>

<canvas id="game" width="500" height="500"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const tile = 20;
const size = 500;

let state = "menu"; // menu, game, gameover
let snake, direction, food;
let interval;
let speed = 100;

let coins = parseInt(localStorage.getItem("coins")) || 0;
let highscore = parseInt(localStorage.getItem("highscore")) || 0;
let snakeColor = localStorage.getItem("snakeColor") || "lime";

function initGame(){
    snake = [{x:240,y:240}];
    direction = null;
    spawnFood();
}

function spawnFood(){
    food = {
        x: Math.floor(Math.random()*25)*20,
        y: Math.floor(Math.random()*25)*20
    };
}

function startGame(){
    state = "game";
    initGame();
    interval = setInterval(update, speed);
}

function update(){

    if(!direction) return;

    let head = {x:snake[0].x, y:snake[0].y};

    if(direction=="right") head.x+=tile;
    if(direction=="left") head.x-=tile;
    if(direction=="up") head.y-=tile;
    if(direction=="down") head.y+=tile;

    if(head.x<0 || head.y<0 || head.x>=size || head.y>=size){
        endGame();
        return;
    }

    for(let part of snake){
        if(head.x==part.x && head.y==part.y){
            endGame();
            return;
        }
    }

    snake.unshift(head);

    if(head.x==food.x && head.y==food.y){
        coins++;
        localStorage.setItem("coins",coins);
        spawnFood();
    }else{
        snake.pop();
    }
}

function endGame(){
    clearInterval(interval);
    state = "gameover";

    if(snake.length > highscore){
        highscore = snake.length;
        localStorage.setItem("highscore",highscore);
    }
}

function drawGrid(){
    ctx.strokeStyle="#222";
    for(let i=0;i<size;i+=20){
        ctx.beginPath();
        ctx.moveTo(i,0);
        ctx.lineTo(i,size);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0,i);
        ctx.lineTo(size,i);
        ctx.stroke();
    }
}

function draw(){

    ctx.clearRect(0,0,size,size);

    if(state=="menu"){
        ctx.fillStyle="white";
        ctx.font="40px Arial";
        ctx.fillText("🐍 CASTLE SNAKE",110,180);

        ctx.font="20px Arial";
        ctx.fillText("High Score: "+highscore,170,230);
        ctx.fillText("Coins: "+coins,200,260);

        ctx.fillStyle="#00ffcc";
        ctx.fillRect(175,300,150,50);
        ctx.fillStyle="black";
        ctx.fillText("PLAY",220,333);
    }

    if(state=="game"){
        drawGrid();

        ctx.fillStyle="red";
        ctx.fillRect(food.x,food.y,tile,tile);

        ctx.fillStyle=snakeColor;
        for(let part of snake){
            ctx.fillRect(part.x,part.y,tile,tile);
        }
    }

    if(state=="gameover"){
        drawGrid();

        ctx.fillStyle="red";
        ctx.font="40px Arial";
        ctx.fillText("GAME OVER",150,220);

        ctx.font="20px Arial";
        ctx.fillText("Score: "+snake.length,200,260);
        ctx.fillText("Click to return",180,300);
    }

    requestAnimationFrame(draw);
}

canvas.addEventListener("click", e=>{
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if(state=="menu"){
        if(mx>175 && mx<325 && my>300 && my<350){
            startGame();
        }
    }

    if(state=="gameover"){
        state="menu";
    }
});

document.addEventListener("keydown", e=>{
    if(e.key=="ArrowRight" && direction!="left") direction="right";
    if(e.key=="ArrowLeft" && direction!="right") direction="left";
    if(e.key=="ArrowUp" && direction!="down") direction="up";
    if(e.key=="ArrowDown" && direction!="up") direction="down";
});

draw();

</script>
</body>
</html>
