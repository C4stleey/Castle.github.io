<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake Pro</title>
<style>
body {
    margin: 0;
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    background: black;
    border: 5px solid #7fffd4;
}
</style>
</head>
<body>

<canvas id="game" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let gameState = "menu";

let coins = parseInt(localStorage.getItem("coins")) || 0;
let highscore = parseInt(localStorage.getItem("highscore")) || 0;
let snakeColor = localStorage.getItem("snakeColor") || "#66ff66";
let ownedColors = JSON.parse(localStorage.getItem("ownedColors")) || [0];

let snake = [];
let direction = "right";
let food = {};
let score = 0;

let colors = [
    { color: "#66ff66", price: 0 },
    { color: "#66ccff", price: 20 },
    { color: "#ff3333", price: 40 },
    { color: "#ffff33", price: 60 }
];

let selectedIndex = 0;

// ================= MENU =================

function drawMenu() {
    ctx.clearRect(0,0,600,600);

    ctx.fillStyle = "white";
    ctx.textAlign = "center";

    ctx.font = "40px Arial";
    ctx.fillText("SNAKE PRO", 300, 150);

    ctx.font = "25px Arial";
    ctx.fillText("PLAY", 300, 250);
    ctx.fillText("SHOP", 300, 300);

    ctx.font = "18px Arial";
    ctx.fillText("Highscore: " + highscore, 300, 400);
    ctx.fillText("Coins: " + coins, 300, 430);
}

// ================= GAME =================

function startGame() {
    snake = [{x:10,y:10}];
    direction = "right";
    score = 0;
    spawnFood();
    gameState = "game";
}

function spawnFood() {
    food = {
        x: Math.floor(Math.random()*30),
        y: Math.floor(Math.random()*30)
    };
}

function updateGame() {
    if (gameState !== "game") return;

    let head = {...snake[0]};

    if (direction==="right") head.x++;
    if (direction==="left") head.x--;
    if (direction==="up") head.y--;
    if (direction==="down") head.y++;

    if (head.x<0||head.x>=30||head.y<0||head.y>=30) return endGame();

    for (let part of snake) {
        if (head.x===part.x && head.y===part.y) return endGame();
    }

    snake.unshift(head);

    if (head.x===food.x && head.y===food.y) {
        score++;
        coins++;
        spawnFood();
    } else {
        snake.pop();
    }
}

function drawGame() {
    ctx.clearRect(0,0,600,600);

    ctx.strokeStyle="#222";
    for (let i=0;i<600;i+=20){
        ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,600); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(600,i); ctx.stroke();
    }

    ctx.fillStyle=snakeColor;
    for (let part of snake){
        ctx.fillRect(part.x*20,part.y*20,20,20);
    }

    ctx.fillStyle="red";
    ctx.fillRect(food.x*20,food.y*20,20,20);

    ctx.fillStyle="white";
    ctx.font="18px Arial";
    ctx.textAlign="left";
    ctx.fillText("Score: "+score,10,20);
    ctx.fillText("Highscore: "+highscore,10,40);

    ctx.textAlign="right";
    ctx.fillText("Coins: "+coins,590,20);
}

function endGame(){
    if(score>highscore){
        highscore=score;
        localStorage.setItem("highscore",highscore);
    }
    localStorage.setItem("coins",coins);
    gameState="menu";
}

// ================= SHOP =================

function drawShop(){
    ctx.clearRect(0,0,600,600);

    ctx.fillStyle="white";
    ctx.textAlign="center";

    ctx.font="35px Arial";
    ctx.fillText("SHOP",300,100);

    ctx.textAlign="right";
    ctx.font="20px Arial";
    ctx.fillText("Coins: "+coins,580,40);

    ctx.textAlign="left";
    ctx.fillText("← RETURN",20,40);

    ctx.fillStyle=colors[selectedIndex].color;
    ctx.fillRect(250,220,100,100);

    ctx.fillStyle="white";
    ctx.font="40px Arial";
    ctx.fillText("<",180,285);
    ctx.fillText(">",420,285);

    ctx.font="20px Arial";
    ctx.textAlign="center";

    let price=colors[selectedIndex].price;

    if(ownedColors.includes(selectedIndex)){
        ctx.fillText("OWNED (click to use)",300,360);
    }else{
        ctx.fillText("BUY - "+price+" Coins",300,360);
    }
}

// ================= INPUT =================

document.addEventListener("keydown",e=>{
    if(gameState==="game"){
        if(e.key==="ArrowUp"&&direction!=="down")direction="up";
        if(e.key==="ArrowDown"&&direction!=="up")direction="down";
        if(e.key==="ArrowLeft"&&direction!=="right")direction="left";
        if(e.key==="ArrowRight"&&direction!=="left")direction="right";
    }
});

canvas.addEventListener("click",e=>{
    let x=e.offsetX;
    let y=e.offsetY;

    if(gameState==="menu"){
        if(y>220&&y<260) startGame();
        if(y>270&&y<310) gameState="shop";
    }

    else if(gameState==="shop"){

        if(x<150&&y<60){
            gameState="menu";
            return;
        }

        if(x>150&&x<220&&y>250&&y<320){
            selectedIndex--;
            if(selectedIndex<0) selectedIndex=colors.length-1;
        }

        if(x>380&&x<450&&y>250&&y<320){
            selectedIndex++;
            if(selectedIndex>=colors.length) selectedIndex=0;
        }

        if(y>330&&y<380){
            let price=colors[selectedIndex].price;

            if(!ownedColors.includes(selectedIndex)){
                if(coins>=price){
                    coins-=price;
                    ownedColors.push(selectedIndex);
                    localStorage.setItem("coins",coins);
                    localStorage.setItem("ownedColors",JSON.stringify(ownedColors));
                }
            }else{
                snakeColor=colors[selectedIndex].color;
                localStorage.setItem("snakeColor",snakeColor);
            }
        }
    }
});

// ================= LOOP =================

let lastTime = 0;
let gameSpeed = 120; // menor número = más rápido

function loop(currentTime){

    if(currentTime - lastTime > gameSpeed){
        updateGame();
        lastTime = currentTime;
    }

    if(gameState==="menu") drawMenu();
    if(gameState==="game") drawGame();
    if(gameState==="shop") drawShop();

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
